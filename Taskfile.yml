version: "3"

# Host toolchain (go, node); CI is the gate. A village's own tasks — logs, codes,
# imports on its VM — live in that village's deploy repo, not here.
tasks:
  default:
    cmds: [task --list]
  be:test:
    desc: vet + test the backend
    dir: backend
    # Twice: the demo tag changes New() and /api/status for every test, so the whole suite runs under it too.
    cmds: [go vet ./..., go test ./..., go vet -tags demo ./..., go test -tags demo ./...]
  be:run:
    desc: run the backend locally on 127.0.0.1:8788 with ./data
    dir: backend
    # loopback only, so the macOS firewall never asks; the rest because the binary has no default village
    env: { BIND: 127.0.0.1, VILLAGE_NAME: Dev, LANGUAGES: "sl,en", PUBLIC_URL: http://localhost:5173, PUSH_SUBJECT: "mailto:dev@localhost" }
    cmds: [go run .]
  be:image:
    desc: build the backend image locally
    cmds: [docker build -f backend/Dockerfile -t porta-pagi:local .]
  be:demo-image:
    desc: build the demo image locally, the door with no code compiled in (the pagi-demo preview runs it)
    cmds: [docker build -f backend/Dockerfile --build-arg TAGS=demo -t porta-pagi-demo:local .]
  fe:dev:
    desc: vite dev server on :5173, proxies /api to the backend on :8788
    dir: frontend
    cmds: [npm run dev]
  fe:build:
    desc: typecheck + build the frontend
    dir: frontend
    cmds: [npm run build]
  check:
    desc: everything CI runs
    cmds: [task be:test, task fe:build]
