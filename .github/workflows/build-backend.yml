name: Build image

# Builds backend/Dockerfile (which builds the frontend too) and pushes it to
# GHCR as sha-<commit> and latest. Nothing deploys from here: a village rolls
# the tag in its own deploy repo. The GHCR package must be public for a village
# to pull anonymously (Package settings → Change visibility — one-time, after
# the first push).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # The image now carries the frontend too (backend/Dockerfile builds it).
      - "frontend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the changelog page is written from it.
          fetch-depth: 0
      - name: Changelog from the git log
        # The Docker web stage has no git, so the file is written here and
        # copied in with frontend/ (frontend/scripts/changelog.mjs).
        run: node frontend/scripts/changelog.mjs
      - name: Test
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: cd backend && go vet ./... && go test ./...
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dennislapchenko/porta-pagi
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root: the Dockerfile builds frontend/ and backend/ together.
          context: .
          file: backend/Dockerfile
          push: true
          # GHCR rejected the first push with 'unknown blob' on the provenance
          # attestation manifest; plain image manifests push fine.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
